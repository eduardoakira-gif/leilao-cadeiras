<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Escaneie e concorra | Fluxo W7M</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  main { height: 100vh; height: 100dvh; display: grid; place-items: center; padding: 3vmin; }
  .tela { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2.2vmin; }
  .logo { width: 13vmin; height: 13vmin; }
  h1 { font-size: 9vmin; }
  .sub { color: var(--suave); font-size: 3vmin; font-weight: 600; margin: -1vmin 0 0; }
  .texto { display: flex; flex-direction: column; align-items: center; gap: 2.2vmin; }
  .qr { width: 66vmin; height: 66vmin; background: #fff; border-radius: 3vmin; padding: 2.4vmin; position: relative; }
  .anel { padding: 1vmin; border-radius: 3.8vmin; background: var(--grad); box-shadow: 0 0 8vmin rgba(176,5,255,.35); }
  .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .timer { display: flex; align-items: baseline; gap: 2vmin; }
  .timer span { white-space: nowrap; color: var(--suave); font-weight: 600; font-size: 2.6vmin; text-transform: uppercase; letter-spacing: .14em; }
  .timer b { font-family: var(--titulo); font-weight: 400; font-size: 7vmin; line-height: 1; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .fechado { display: none; }
  .social { display: none; align-items: center; gap: 1.2vmin; font-size: 3vmin; font-weight: 600; color: var(--texto); padding: 1.2vmin 2.4vmin; border: 1px solid var(--linha); border-radius: 999px; background: var(--carvao-2); }
  .social::before { content: ""; width: 1.6vmin; height: 1.6vmin; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 .8vmin rgba(91,227,164,.18); }
  .social b { font-family: var(--titulo); font-weight: 400; font-size: 4.2vmin; line-height: 1; }
  .fechado h1 { font-size: 11vmin; }
  .fechado p { color: var(--suave); font-size: 3.4vmin; margin: 0; }
  /* Tablet deitado: QR ao lado do texto */
  @media (orientation: landscape) {
    .tela { flex-direction: row; gap: 6vmin; text-align: left; }
    .texto { display: flex; flex-direction: column; align-items: flex-start; gap: 2.4vmin; max-width: 46vw; }
    .qr { width: 72vmin; height: 72vmin; }
    h1 { font-size: 11vmin; }
    .fechado { text-align: center; }
    .timer { flex-direction: column; align-items: flex-start; gap: .6vmin; }
    .timer b { font-size: 9vmin; }
    .sub { white-space: nowrap; }
  }
</style>
</head>
<body>
<main>
  <div class="tela" id="aberto">
    <div class="texto">
      <img class="logo" src="logo.png" alt="Fluxo W7M">
      <h1 class="titulo">Escaneie e concorra a um <span class="grad-txt">brinde</span></h1>
      <p class="sub">Aponte a câmera do celular · leva 20 segundos</p>
      <div class="timer"><span>Sorteio às 19h · faltam</span><b class="grad-txt" id="t">--:--:--</b></div>
      <div class="social" id="social"><b id="qtd">0</b> pessoas já estão concorrendo</div>
    </div>
    <div class="anel"><div class="qr"><img src="qr-tablet.png" alt="QR code para se cadastrar no sorteio"></div></div>
  </div>
  <div class="tela fechado" id="fechado">
    <div>
      <img class="logo" src="logo.png" alt="Fluxo W7M" style="margin:0 auto 2vmin;display:block">
      <h1 class="titulo">Inscrições <span class="grad-txt">encerradas</span></h1>
      <p>O sorteio do brinde está acontecendo agora. Boa sorte!</p>
    </div>
  </div>
</main>
<script src="config.js?v=3"></script>
<script>
  const FIM = new Date(window.SORTEIO_HORA || '2026-11-14T19:00:00-03:00').getTime();
  const p = n => String(n).padStart(2, '0');
  function tick() {
    const s = Math.max(0, Math.floor((FIM - Date.now()) / 1000));
    document.getElementById('t').textContent = p(Math.floor(s / 3600)) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
    if (s === 0) { document.getElementById('aberto').style.display = 'none'; document.getElementById('fechado').style.display = 'flex'; }
  }
  setInterval(tick, 1000); tick();
  // Contador ao vivo (aparece a partir de 5 participantes)
  async function contar() {
    if (!window.SORTEIO_API) return;
    try {
      const d = await (await fetch(window.SORTEIO_API + '?acao=stats&t=' + Date.now())).json();
      if (d.ok && d.total >= 5) { document.getElementById('qtd').textContent = d.total; document.getElementById('social').style.display = 'inline-flex'; }
    } catch (e) {}
  }
  contar(); setInterval(contar, 30000);
  // Mantém a tela do tablet acesa quando o navegador permite
  async function acordado() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
  acordado(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') acordado(); });
</script>
</body>
</html>
